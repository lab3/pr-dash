name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Queue Claude runs per PR/issue so parallel @claude comments don't race each other's pushes.
# run_id is the fallback so an event with neither number never shares one global group.
concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # contents: read is enough. The action commits and pushes through the Claude GitHub App's own
    # token, not GITHUB_TOKEN, so bumping this to write buys nothing. pull-requests: write is for
    # `gh api`, which runs on GITHUB_TOKEN, replying inside review threads.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Let the PR Watcher bot tag @claude. The action rejects bot actors unless listed here.
          allowed_bots: "grok-pr-watcher[bot]"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Answer each Watcher finding inside its own review thread, so the verdict sits next to
          # the finding on GitHub and in PR Dash. The tracking comment alone is invisible to both.
          # A bare `prompt` would switch the action to agent mode (no branch, no push, no tracking
          # comment); track_progress keeps tag mode and injects the prompt as extra instructions.
          track_progress: true
          prompt: |
            Follow the instructions in the comment that tagged you. In addition, when the trigger
            is a review from a bot that opened inline review threads:
            - Reply inside each of those threads with your verdict in one or two sentences:
              fixed (name the commit), disagree (say why), or deferred (say why). Post the reply
              with `gh api repos/${{ github.repository }}/pulls/<number>/comments/<comment_id>/replies -f body=...`.
            - Resolve the threads you fixed with `gh api graphql` and the `resolveReviewThread`
              mutation. Leave threads you disagree with open.
            - Keep your tracking comment as the summary; do not repeat the per-finding text there.

          # Opus 5.5 at high effort (its default is medium). Let Claude sync a branch that moved under
          # it and run the tests/checks. The git patterns are prefix matches pinned to the origin
          # remote, so arbitrary remotes or refs are not pre-approved.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model claude-opus-5-5 --effort high --allowedTools "Bash(git fetch origin:*),Bash(git pull --rebase origin:*),Bash(git pull origin:*),Bash(git rebase origin/:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(npm ci),Bash(npm test:*),Bash(npm run check:*),Bash(gh api repos/${{ github.repository }}/pulls/:*),Bash(gh api graphql:*)"'
