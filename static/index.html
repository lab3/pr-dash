<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Dash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%2357a5ff' d='M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.25 2.25 0 1 0 1.5 0Zm7.5 5.256V5.5A2.5 2.5 0 0 0 10 3H8.56l1.22-1.22-1.06-1.06-3.03 3.03 3.03 3.03 1.06-1.06L8.56 4.5H10a1 1 0 0 1 1 1v5.128a2.25 2.25 0 1 0 1.5 0Z'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.25 2.25 0 1 0 1.5 0Zm7.5 5.256V5.5A2.5 2.5 0 0 0 10 3H8.56l1.22-1.22-1.06-1.06-3.03 3.03 3.03 3.03 1.06-1.06L8.56 4.5H10a1 1 0 0 1 1 1v5.128a2.25 2.25 0 1 0 1.5 0Z"/></svg>
      <h1>PR Dash</h1>
      <span id="viewer" class="muted"></span>
    </div>
    <div class="controls">
      <input id="filter" type="search" placeholder="Filter repos, titles, authors, labels…  ( / )" autocomplete="off">
      <select id="sort" aria-label="Sort repos">
        <option value="count">Most open PRs</option>
        <option value="updated">Recently updated</option>
        <option value="name">Name</option>
      </select>
      <div id="layout" class="seg" role="group" aria-label="Layout (g)">
        <button type="button" data-layout="list" title="List layout (g)" aria-label="List layout">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M5.75 2.5h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 5h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5Zm0 5h8.5a.75.75 0 0 1 0 1.5h-8.5a.75.75 0 0 1 0-1.5ZM2 14a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-6a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM2 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>
          <span>List</span>
        </button>
        <button type="button" data-layout="grid" title="Grid layout (g)" aria-label="Grid layout">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2.5 1.75v4.5c0 .138.112.25.25.25h4.5a.25.25 0 0 0 .25-.25v-4.5a.25.25 0 0 0-.25-.25h-4.5a.25.25 0 0 0-.25.25ZM1 1.75C1 .784 1.784 0 2.75 0h4.5C8.216 0 9 .784 9 1.75v4.5A1.75 1.75 0 0 1 7.25 8h-4.5A1.75 1.75 0 0 1 1 6.25Zm9.5 0v4.5c0 .138.112.25.25.25h4.5a.25.25 0 0 0 .25-.25v-4.5a.25.25 0 0 0-.25-.25h-4.5a.25.25 0 0 0-.25.25ZM9 1.75C9 .784 9.784 0 10.75 0h4.5c.966 0 1.75.784 1.75 1.75v4.5A1.75 1.75 0 0 1 15.25 8h-4.5A1.75 1.75 0 0 1 9 6.25Zm-6.5 8v4.5c0 .138.112.25.25.25h4.5a.25.25 0 0 0 .25-.25v-4.5a.25.25 0 0 0-.25-.25h-4.5a.25.25 0 0 0-.25.25ZM1 9.75C1 8.784 1.784 8 2.75 8h4.5C8.216 8 9 8.784 9 9.75v4.5A1.75 1.75 0 0 1 7.25 16h-4.5A1.75 1.75 0 0 1 1 14.25Zm9.5 0v4.5c0 .138.112.25.25.25h4.5a.25.25 0 0 0 .25-.25v-4.5a.25.25 0 0 0-.25-.25h-4.5a.25.25 0 0 0-.25.25ZM9 9.75C9 8.784 9.784 8 10.75 8h4.5c.966 0 1.75.784 1.75 1.75v4.5A1.75 1.75 0 0 1 15.25 16h-4.5A1.75 1.75 0 0 1 9 14.25Z"/></svg>
          <span>Grid</span>
        </button>
      </div>
      <button id="refresh" type="button" title="Refresh from GitHub (r)">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5ZM1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834Z"/></svg>
        <span>Refresh</span>
      </button>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Views (1–9)"></nav>

  <section class="subbar">
    <div id="summary" class="summary"></div>
    <div class="toggles">
      <select id="owner" aria-label="Filter by owner or org" hidden></select>
      <label><input type="checkbox" id="t-drafts"> Hide drafts</label>
      <label><input type="checkbox" id="t-review"> Only needs my review</label>
      <label><input type="checkbox" id="t-mine"> Only mine</label>
      <label id="t-empty-label"><input type="checkbox" id="t-empty"> Show repos with no PRs</label>
    </div>
  </section>

  <main>
    <div id="notice"></div>
    <div id="repos"></div>
    <div id="empty-repos"></div>
  </main>

  <footer id="footer" class="muted"></footer>

  <script type="module" src="/app.ts"></script>
</body>
</html>
